<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta ONPE | Credenciales</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-red-600 mb-2">Consulta ONPE</h1>
      <p class="text-gray-600 text-sm">Verifica si eres miembro de mesa y descarga tu credencial oficial.</p>
    </div>

    <form id="formularioONPE" class="space-y-4">
      <div>
        <label for="dni" class="block text-sm font-medium text-gray-700">Número de DNI</label>
        <input type="text" id="dni" name="dni" maxlength="8" pattern="\d{8}" required
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-red-500 focus:border-red-500"
          placeholder="Ej. 75022964">
      </div>

      <button type="submit" id="btnConsultar"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
        Consultar DNI
      </button>
    </form>

    <div id="estado" class="mt-6 text-center hidden">
      <p class="text-blue-600 font-semibold animate-pulse">Cargando... el bot está consultando (puede tardar hasta 30
        seg)</p>
    </div>

    <div id="resultado" class="mt-6 hidden">
    </div>
  </div>

  <script>
    document.getElementById('formularioONPE').addEventListener('submit', async function (e) {
      e.preventDefault(); // Evita que la página recargue

      const dni = document.getElementById('dni').value;
      const btn = document.getElementById('btnConsultar');
      const estado = document.getElementById('estado');
      const resultado = document.getElementById('resultado');

      // 1. Mostrar estado de carga
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      estado.classList.remove('hidden');
      resultado.classList.add('hidden');
      resultado.innerHTML = '';

      try {
        // ⚠️ CAMBIA ESTO: Pon la IP de tu Droplet de DigitalOcean y la ruta de tu API
        // Ejemplo: 'http://167.71.123.45:3000/api/credencial'
        const urlBackend = 'http://147.182.207.33:3000/api/credencial';

        const response = await fetch(urlBackend, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ dni: dni })
        });

        const data = await response.json();

        // 2. Procesar la respuesta
        estado.classList.add('hidden');
        resultado.classList.remove('hidden');

        if (data.esMiembro) {
          // Es miembro y hay URL del PDF
          resultado.innerHTML = `
                        <div class="p-4 bg-green-50 border border-green-200 rounded-md">
                            <h3 class="text-green-800 font-bold mb-2">¡Eres Miembro de Mesa!</h3>
                            <a href="${data.url_descarga}" target="_blank"
                               class="inline-block w-full text-center py-2 px-4 bg-green-600 hover:bg-green-700 text-white rounded-md transition-colors">
                                Ver y Descargar Credencial (PDF)
                            </a>
                        </div>
                    `;
        } else {
          // No es miembro
          resultado.innerHTML = `
                        <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-md">
                            <h3 class="text-yellow-800 font-bold">Resultado</h3>
                            <p class="text-yellow-700 mt-1">${data.mensaje || 'NO ERES MIEMBRO DE MESA'}</p>
                        </div>
                    `;
        }

      } catch (error) {
        // Error de conexión
        console.error("Error:", error);
        estado.classList.add('hidden');
        resultado.classList.remove('hidden');
        resultado.innerHTML = `
                    <div class="p-4 bg-red-50 border border-red-200 rounded-md">
                        <h3 class="text-red-800 font-bold">Error de conexión</h3>
                        <p class="text-red-700 mt-1 text-sm">No se pudo contactar al servidor. Verifica que el bot esté encendido.</p>
                    </div>
                `;
      } finally {
        // Restaurar el botón
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });
  </script>
</body>

</html>
